# contents entry so `src/kernel/x.cpp` lands `Sources/libbitcoinkernel/
# src/kernel/x.cpp`, matching the pre-migration layout exactly.
# `src/compat/compat.h` is deliberately NOT excluded here — it syncs fresh
# and `main-function-guard.patch` re-applies on top (see header comment).
