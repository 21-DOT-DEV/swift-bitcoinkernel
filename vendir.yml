# Managed by vendir — https://carvel.dev/vendir
#
# Declarative source-vendoring config — the successor to `subtree.yaml`,
# the `swift package plugin subtree-sync` plugin, and the committed
# `Vendor/bitcoin` mirror (git-subtree squashes), all removed in spec
# 006-vendir-migration Phase 2. This file is the authority for the
# extracted trees. Drive it through `Scripts/vendor-sync.sh`, not bare
# `vendir sync` — the vendored trees are only correct after that
# script's patch-apply and fixup stages (below).
#
# Fetch shape: ONE `git:` contents entry clones bitcoin/bitcoin at the
# pinned ref into `.vendir-upstream/bitcoin/` — gitignored scratch that also
# serves as the `git apply --check` validation tree for patches/ (the role
# `Vendor/bitcoin` played). Every other entry is a `directory:` slice that
# copies a filtered subset of that checkout — local copies, no refetch.
# Why: released vendir fetches once per `git:` contents entry with no
# cross-entry cache (carvel-dev/vendir#101) and fetches *every* ref for a
# named tag (carvel-dev/vendir#453, unshipped at 0.47.0). bitcoin/bitcoin
# carries ~715 refs, so per-destination `git:` entries would download the
# same several-hundred-MB pack ~8 times. This is swift-openssl's
# cache+slice shape, minus its wrapper and provenance sidecar — our cache
# entry IS a git source, so `vendir.lock.yml` records the real upstream
# commit SHA.
#
# ignorePaths contract: vendir wipes each `directories[].path` before
# copying; `ignorePaths` carries the listed destination files across the
# wipe — hand-written modulemaps, build-config headers, the
# `src/bridge/` shims, and the `include/` umbrella trees (patches/README.md
# § "Custom build files"). Entries must be literal FILE paths: vendir
# stats each glob match and aborts on a directory, so `include/**` is
# fatal wherever `include/` holds a subdirectory (observed at
# Sources/bitcoind/include/config). Patch-touched files are NOT
# ignored: they sync fresh and `vendor-sync.sh` re-applies the `.patch`
# artifacts, so upstream drift under a patch fails loudly at sync time.
# `src/compat/compat.h` therefore rides the normal `src/**/*.h` sync — its
# subtree-era exclusion is dropped and `main-function-guard.patch` owns the
# delta. Caveat: a future upstream file landing at one of these exact
# destination paths would be silently shadowed — the planned
# `vendir-check.yml` (T010/T011, not yet landed) probes the synced cache
# for that.
#
# License files ride with the vendored code (the sibling spec's precedent):
# bitcoin's `COPYING` into the two bitcoin-code targets, each vendored
# library's own license into its tree — all excluded in Package.swift so
# SPM doesn't warn on unhandled files.
#
# `includePaths`/`excludePaths` match upstream-repo-relative paths BEFORE
# `newRootPath` re-roots, and `ignorePaths` are destination-relative.
# Brace groups from subtree.yaml are expanded to explicit globs.

apiVersion: vendir.k14s.io/v1alpha1
kind: Config
minimumRequiredVersion: 0.47.0

directories:

# === Upstream checkout — the only network fetch ===
# Pristine bitcoin/bitcoin at the pinned ref. vendir syncs directories in
# config order, so this lands first and every slice below copies from it.
- path: .vendir-upstream/bitcoin
  contents:
  - path: .
    git:
      url: https://github.com/bitcoin/bitcoin.git
      ref: v31.0 # annotated, GPG-signed upstream release tag
      depth: 1
      skipInitSubmodules: true
    legalPaths: []

# === Vendored C/C++ libraries (each its own SPM target) ===

- path: Sources/crc32c
  contents:
  - path: .
    directory: {path: .vendir-upstream/bitcoin}
    newRootPath: src/crc32c
    includePaths:
    - src/crc32c/include/**/*.h
    - src/crc32c/include/**/*.cc
    - src/crc32c/src/**/*.h
    - src/crc32c/src/**/*.cc
    - src/crc32c/LICENSE
    excludePaths:
    - '**/*_unittest*'
    - '**/*_test_main*'
    - '**/*_benchmark*'
    - '**/*_capi_*'
    - '**/*_extend_*'
    ignorePaths:
    - include/module.modulemap
    - include/crc32c/crc32c_config.h # generated; upstream ships only crc32c_config.h.cmakein
    legalPaths: []

- path: Sources/leveldb
  contents:
  - path: .
    directory: {path: .vendir-upstream/bitcoin}
    newRootPath: src/leveldb
    includePaths:
    - src/leveldb/include/**/*.h
    - src/leveldb/include/**/*.cc
    - src/leveldb/db/**/*.h
    - src/leveldb/db/**/*.cc
    - src/leveldb/helpers/**/*.h
    - src/leveldb/helpers/**/*.cc
    - src/leveldb/port/**/*.h
    - src/leveldb/port/**/*.cc
    - src/leveldb/table/**/*.h
    - src/leveldb/table/**/*.cc
    - src/leveldb/util/**/*.h
    - src/leveldb/util/**/*.cc
    - src/leveldb/LICENSE
    excludePaths:
    - '**/*_test.cc'
    - '**/testharness*'
    - '**/testutil*'
    - '**/env_windows*'
    - '**/leveldbutil*'
    - '**/port_example*'
    - '**/windows_logger*'
    ignorePaths:
    - include/module.modulemap
    - include/port/port_config.h # generated; upstream ships only port_config.h.in
    legalPaths: []

- path: Sources/minisketch
  contents:
  - path: .
    directory: {path: .vendir-upstream/bitcoin}
    newRootPath: src/minisketch
    includePaths:
    - src/minisketch/include/**/*.h
    - src/minisketch/include/**/*.cpp
    - src/minisketch/src/**/*.h
    - src/minisketch/src/**/*.cpp
    - src/minisketch/LICENSE
    excludePaths:
    - '**/bench*'
    - '**/test*'
    - '**/clmul_*'
    ignorePaths:
    - include/module.modulemap
    legalPaths: []

- path: Sources/secp256k1
  contents:
  - path: .
    directory: {path: .vendir-upstream/bitcoin}
    newRootPath: src/secp256k1
    includePaths:
    - src/secp256k1/include/**/*.h
    - src/secp256k1/include/**/*.c
    - src/secp256k1/src/**/*.h
    - src/secp256k1/src/**/*.c
    - src/secp256k1/COPYING
    excludePaths:
    - '**/bench*'
    - '**/test*'
    - '**/unit_test*'
    - '**/ctime_tests*'
    - '**/precompute_ecmult*'
    - '**/scalar_low*'
    - '**/field_5x52_asm_impl*'
    - '**/wycheproof/**'
    ignorePaths:
    - include/module.modulemap
    legalPaths: []

# === libbitcoinkernel — headers at src/**/*.h plus the kernel .cpp set ===
