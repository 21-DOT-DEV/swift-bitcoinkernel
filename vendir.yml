# === Test fixtures — nested landing, flattened by vendor-sync.sh ===
# The four JSONs come from two different upstream dirs and must land flat
# in Fixtures/ (test code loads them via subdirectory: "Fixtures"). vendir
# forbids overlapping contents paths, so they arrive repo-relative and the
# wrapper's fixup stage moves them up and removes the skeleton dirs.
- path: Tests/BitcoinTests/Fixtures
  contents:
  - path: .
    directory: {path: .vendir-upstream/bitcoin}
    includePaths:
    - test/functional/data/rpc_getblockstats.json
    - test/functional/data/rpc_decodescript.json
    - test/functional/data/rpc_psbt.json
    - src/test/data/blockfilters.json
    legalPaths: []
