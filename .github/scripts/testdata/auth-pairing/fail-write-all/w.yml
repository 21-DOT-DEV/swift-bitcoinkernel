name: fail-write-all
on: push
permissions: {}
jobs:
  build:
    runs-on: macos-26
    permissions: write-all
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/github-git-auth
        with:
          token: ${{ github.token }}
      - run: swift build
