name: fail-checkout-order
on: push
permissions: {}
jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      # Auth runs before checkout — the checkout's own fetch then sends the
      # extraheader plus its own credential = two Authorization headers.
      - uses: ./.github/actions/github-git-auth
        with:
          token: ${{ github.token }}
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: swift build
