name: selftest
on: push
permissions: {}
jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AUTH_LINT_EXEMPT: "write scope exists to prove the FR-008 token-scope warning fires"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/github-git-auth
        with:
          token: ${{ github.token }}
      - run: gh release create canary
        env:
          GH_TOKEN: ${{ github.token }}
