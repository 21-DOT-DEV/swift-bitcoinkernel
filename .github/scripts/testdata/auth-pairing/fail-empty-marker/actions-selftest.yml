name: fail-empty-marker
on: push
permissions: {}
jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # An empty marker does not count as a reason — the write-scope rule
      # still applies.
      AUTH_LINT_EXEMPT: ""
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/github-git-auth
        with:
          token: ${{ github.token }}
      - run: gh release create canary
        env:
          GH_TOKEN: ${{ github.token }}
