name: ok-workflow-level-read
on: push
# Read at the workflow level, no job-level block — the job inherits it.
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/github-git-auth
        with:
          token: ${{ github.token }}
      - run: swift build
