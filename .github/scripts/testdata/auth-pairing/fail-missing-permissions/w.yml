name: fail-missing-permissions
on: push
# No `permissions:` at either level — the token inherits the repository
# default, which may be write. Conservative failure.
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/github-git-auth
        with:
          token: ${{ github.token }}
      - run: swift build
