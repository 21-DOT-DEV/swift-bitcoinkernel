name: ok-dollar-slash
on: push
permissions: {}
jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The `$/` form resolves the action against the workflow-commit tree;
      # the lint must recognize it exactly like the `./` form.
      - uses: $/.github/actions/github-git-auth
        with:
          token: ${{ github.token }}
      - run: swift build
