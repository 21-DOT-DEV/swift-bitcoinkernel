name: Apple Platforms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  macos:
    name: macOS (${{ matrix.name }})
    runs-on: macos-26
    # ~4x the slowest observed run (~8 min) — every job in this workflow
    # carries a bound; GitHub's 360-min default is never the operating limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: default, traits: "" }
          - { name: wallet,  traits: "wallet" }
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: "/Applications/Xcode_26.4.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v6
        with:
          # github-git-auth sets a github.com Authorization header globally;
          # checkout's own persisted credential would make a second one, and
          # github.com answers two with a bare 400.
          persist-credentials: false
      # Sends GITHUB_TOKEN on every github.com git request — the `swift
      # test`/plugin steps below resolve package dependencies with an
      # anonymous-clone burst that GitHub throttles on a shared per-IP quota
      # (see .github/actions/github-git-auth).
      - name: Authenticate GitHub clones
        uses: ./.github/actions/github-git-auth
        with:
          token: ${{ github.token }}
      # Two invocations. The first runs the package in PARALLEL: the
      # `.kernelSerialized` trait serializes libbitcoinkernel's process-global
      # state tests in-process (Tests/BitcoinKernelTests/Support/KernelSerialization.swift),
      # and the Esplora tests use an in-memory HTTP double, so `--no-parallel` is
      # not needed. The one exit test (`#expect(processExitsWith:)`, the #35293
      # trap guard) gates itself off with `.enabled(if: env["RUN_EXIT_TESTS"])`,
      # so it auto-skips here; run it on demand via `RUN_EXIT_TESTS=1 swift test
      # --no-parallel` (exit tests can't run under the parallel runner or be
      # `--filter`-isolated). The second invocation isolates the embedded-bitcoind
      # suite in its own process — it holds the global BCLog logger open and can't
      # share a process with kernel LoggingConnection tests (the original
      # `--traits wallet` SIGABRT). See `.github/AGENTS.md`.
      # --disable-dependency-cache on every swift-family step below: clones go
      # to .build, never the shared repo cache whose mid-fetch death is fatal
      # (swiftlang/swift-package-manager#9037); the cache buys nothing on a
      # fresh runner anyway.
      - name: Test — package (parallel; kernel-state tests gated in-process)
        run: swift test --disable-dependency-cache --skip 'BitcoinTests\.BitcoinTests/' ${{ matrix.traits && format('--traits {0}', matrix.traits) || '' }}
      - name: Test — Bitcoin Integration daemon (isolated process)
        run: swift test --disable-dependency-cache --filter 'BitcoinTests\.BitcoinTests/' ${{ matrix.traits && format('--traits {0}', matrix.traits) || '' }}
      - name: Validate DocC catalog (Bitcoin)
        if: matrix.name == 'default'
        run: swift package --disable-dependency-cache generate-documentation --target Bitcoin --analyze --warnings-as-errors
      - name: Validate DocC catalog (BitcoinKernel)
        if: matrix.name == 'default'
        run: swift package --disable-dependency-cache generate-documentation --target BitcoinKernel --analyze --warnings-as-errors

  ios:
    name: iOS
    runs-on: macos-26
    # ~4x observed — see the macOS job's cap note.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SCHEME: BitcoinKernel-Package
      DEVELOPER_DIR: "/Applications/Xcode_26.4.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v6
        with:
          # github-git-auth sets a github.com Authorization header globally;
          # checkout's own persisted credential would make a second one, and
          # github.com answers two with a bare 400.
          persist-credentials: false
      # See the macOS job — xcodebuild's package resolution is equally exposed
      # to anonymous-clone throttling.
      - name: Authenticate GitHub clones
        uses: ./.github/actions/github-git-auth
        with:
          token: ${{ github.token }}
      # The flag pair rides EVERY xcodebuild call in an auth-using job
      # (.github/AGENTS.md): -scmProvider system puts package clones on the
      # git that reads the auth ~/.gitconfig (the built-in provider's config
      # handling is never relied on); -disablePackageRepositoryCache is the
      # xcodebuild-side shared-cache bypass. Inert where unused.
      - name: Build for iOS
        run: |
          xcrun xcodebuild \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -scmProvider system \
            -disablePackageRepositoryCache \
            build \
            -scheme "$SCHEME" \
            -destination generic/platform=iOS

  visionos:
    name: visionOS
    runs-on: macos-26
    # ~4x observed — see the macOS job's cap note.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SCHEME: BitcoinKernel-Package
      DEVELOPER_DIR: "/Applications/Xcode_26.4.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v6
        with:
          # github-git-auth sets a github.com Authorization header globally;
          # checkout's own persisted credential would make a second one, and
          # github.com answers two with a bare 400.
          persist-credentials: false
      # See the macOS job — xcodebuild's package resolution is equally exposed
      # to anonymous-clone throttling.
      - name: Authenticate GitHub clones
        uses: ./.github/actions/github-git-auth
        with:
          token: ${{ github.token }}
      # Flag pair — see the iOS job's note.
      - name: Build for visionOS
        run: |
          xcrun xcodebuild \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -scmProvider system \
            -disablePackageRepositoryCache \
            build \
            -scheme "$SCHEME" \
            -destination generic/platform=visionOS

  tvos:
    name: tvOS (BitcoinKernel)
    runs-on: macos-26
    # ~4x observed — see the macOS job's cap note.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # BitcoinKernel-only on tvOS: the Bitcoin product depends on bitcoind, whose
      # `src/util/exec.cpp` calls `execvp()` — marked `__TVOS_PROHIBITED` in the tvOS SDK.
      SCHEME: BitcoinKernel
      DEVELOPER_DIR: "/Applications/Xcode_26.4.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v6
        with:
          # github-git-auth sets a github.com Authorization header globally;
          # checkout's own persisted credential would make a second one, and
          # github.com answers two with a bare 400.
          persist-credentials: false
      # See the macOS job — xcodebuild's package resolution is equally exposed
      # to anonymous-clone throttling.
      - name: Authenticate GitHub clones
        uses: ./.github/actions/github-git-auth
        with:
          token: ${{ github.token }}
      # Flag pair — see the iOS job's note.
      - name: Build BitcoinKernel for tvOS
        run: |
          xcrun xcodebuild \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -scmProvider system \
            -disablePackageRepositoryCache \
            build \
            -scheme "$SCHEME" \
            -destination generic/platform=tvOS