name: Apple Platforms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  macos:
    name: macOS (${{ matrix.name }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: default, traits: "" }
          - { name: wallet,  traits: "wallet" }
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: "/Applications/Xcode_26.4.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        run: swift test ${{ matrix.traits && format('--traits {0}', matrix.traits) || '' }}
      - name: Validate DocC catalog (Bitcoin)
        if: matrix.name == 'default'
        run: swift package generate-documentation --target Bitcoin --analyze --warnings-as-errors
      - name: Validate DocC catalog (BitcoinKernel)
        if: matrix.name == 'default'
        run: swift package generate-documentation --target BitcoinKernel --analyze --warnings-as-errors

  ios:
    name: iOS
    runs-on: macos-26
    permissions:
      contents: read
    env:
      SCHEME: BitcoinKernel-Package
      DEVELOPER_DIR: "/Applications/Xcode_26.4.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v6
      - name: Build for iOS
        run: |
          xcrun xcodebuild \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            build \
            -scheme "$SCHEME" \
            -destination generic/platform=iOS

  visionos:
    name: visionOS
    runs-on: macos-26
    permissions:
      contents: read
    env:
      SCHEME: BitcoinKernel-Package
      DEVELOPER_DIR: "/Applications/Xcode_26.4.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v6
      - name: Build for visionOS
        run: |
          xcrun xcodebuild \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            build \
            -scheme "$SCHEME" \
            -destination generic/platform=visionOS