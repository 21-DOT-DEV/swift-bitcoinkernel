name: Flake Hunt

# Hand-triggered only — never on push or pull_request.
#
# Repeats one app's test bundle many times on the same runner class where
# load-dependent failures actually appear, and stops at the first one. Two uses:
# measure how often a suspected flake fails BEFORE a fix, then prove zero
# failures over the same iteration count AFTER it. A single green CI run says
# almost nothing about a failure that shows up once in thirty runs.
#
# The build/test split matters here: the bundle is compiled once, so each extra
# iteration costs roughly one test pass (~42s on iOS for KernelApp's 110-test
# bundle — 109 run there now that the 39–184 s `torReadyAutoKicksSync` is
# disabled) rather than a full rebuild.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Scheme to hunt
        type: choice
        options: [KernelApp, NodeApp]
        default: KernelApp
      platform:
        description: Destination platform
        type: choice
        options: [ios, macos]
        default: ios
      iterations:
        description: Number of iterations to run
        type: string
        default: "100"
      stop_early:
        description: Stop at the first failure (off = run all iterations and count them)
        type: boolean
        default: false

permissions: {}

jobs:
  hunt:
    name: ${{ inputs.app }} (${{ inputs.platform }}) x${{ inputs.iterations }}
    # xcode-27 like tuist-apps.yml — the demo apps' minimum toolchain. A
    # NodeApp hunt cannot even compile on Xcode 26 (no compile fence), and a
    # hunt that can't build measures nothing.
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # Same version-pinned path as tuist-apps.yml — see the comment there.
      DEVELOPER_DIR: "/Applications/Xcode_27.0.app/Contents/Developer"
      WORKSPACE: Projects/Bitcoin.xcworkspace
      # Absolute, not relative — see tuist-apps.yml: the Tuist.swift pin is
      # derived from this value and the internal resolve's cwd is not
      # guaranteed.
      DERIVED_DATA: ${{ github.workspace }}/.derivedData
    steps:
      - uses: actions/checkout@v6
        with:
          # github-git-auth sets a github.com Authorization header globally;
          # checkout's own persisted credential would make a second one, and
          # github.com answers two with a bare 400.
          persist-credentials: false

      # Same anonymous-clone throttling defense as tuist-apps.yml — see the
      # comment above that workflow's authenticate step.
      - name: Authenticate GitHub clones
        uses: ./.github/actions/github-git-auth
        with:
          token: ${{ github.token }}

      # Same wiring as tuist-apps.yml's generate step — see the comment
      # there: signature-gated retry, root .build + pinned SourcePackages
      # cleanup, and the TUIST_CLONED_SOURCE_PACKAGES_DIR pin that moves the
      # internal resolve's clones into $DERIVED_DATA for warm reuse by the
      # builds.
      - name: Generate workspace
        timeout-minutes: 30
        uses: ./.github/actions/retry-on-fetch-flake
        env:
          TUIST_CLONED_SOURCE_PACKAGES_DIR: ${{ env.DERIVED_DATA }}/SourcePackages
        with:
          label: tuist generate
          command: swift package --disable-sandbox --disable-dependency-cache tuist generate -p Projects/ --no-open
          cleanup-dirs: |
            .build
            ${{ env.DERIVED_DATA }}/SourcePackages

      # Same pin invariant as tuist-apps.yml — see the comment there.
      - name: Verify pinned clones
        run: |
          CHECKOUTS="$DERIVED_DATA/SourcePackages/checkouts"
          if [ -z "$(ls -A "$CHECKOUTS" 2>/dev/null)" ]; then
            echo "::warning::$CHECKOUTS is missing or empty — the Tuist.swift SourcePackages pin did not apply; the internal resolve fell back to default DerivedData and the builds will re-fetch the package graph"
          fi

      # Mirrors tuist-apps.yml's destination resolution: a device under the
      # NEWEST installed iOS runtime, picked by parsing simctl's JSON rather
      # than head -1 on the text list — that text groups oldest-first, so a
      # NodeApp hunt would otherwise report the iOS-27-only suites as skipped
      # while printing zero failures. The floor is app-gated the same way:
      # only NodeApp carries the gated suites.
      - name: Resolve destination
        env:
          PLATFORM: ${{ inputs.platform }}
          APP: ${{ inputs.app }}
        run: |
          case "$PLATFORM" in
            macos)
              echo "DESTINATION=platform=macOS" >> "$GITHUB_ENV" ;;
            ios)
              PICKED=$(xcrun simctl list devices available -j | jq -r '
                  .devices | to_entries
                  | map(select(.key | test("SimRuntime\\.iOS-[0-9]+-[0-9]+")))
                  | sort_by(.key
                      | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)(-(?<patch>[0-9]+))?")
                      | [(.maj | tonumber), (.min | tonumber), ((.patch // "0") | tonumber)])
                  | reverse
                  | map({
                      runtime: .key,
                      udid: (([.value[] | select(.name | test("^iPhone 1[6-9]")) | .udid][0])
                             // ([.value[] | select(.name | test("^iPhone")) | .udid][0])
                             // "")
                    })
                  | (map(select(.udid != "")) | first) // { runtime: "", udid: "" }
                  | "\(.udid) \(.runtime)"')
              UDID=${PICKED%% *}
              RUNTIME=${PICKED#* }
              if [ -z "$UDID" ] || [ "$UDID" = "$RUNTIME" ]; then
                  echo "::error::no available iPhone simulator on the runner"; exit 1
              fi
              echo "resolved destination: $RUNTIME / $UDID"
              MAJOR=$(echo "$RUNTIME" | sed -E 's/.*iOS-([0-9]+)-.*/\1/')
              if [ "$APP" = "NodeApp" ] && [ "$MAJOR" -lt 27 ]; then
                  echo "::error::newest iOS runtime is $RUNTIME — below iOS 27, so NodeApp's iOS-27-only suites cannot run; add the runtime or drop this floor"; exit 1
              fi
              echo "DESTINATION=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV" ;;
            *)
              echo "::error::unhandled platform '$PLATFORM' — add a -destination case"; exit 1 ;;
          esac

      # The flag pair rides every xcodebuild call in an auth-using job — see
      # apple-builds.yml's iOS job: the provider pins clones onto the git that
      # reads the auth config; the cache flag bypasses the shared repo cache.
      - name: Build ${{ inputs.app }} (${{ inputs.platform }})
        env:
          SCHEME: ${{ inputs.app }}
        run: |
          xcodebuild build-for-testing \
            -skipMacroValidation -skipPackagePluginValidation \
            -scmProvider system -disablePackageRepositoryCache \
            -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -destination "$DESTINATION" -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      # Two modes, because they answer different questions.
      #
      #   stop_early = false (default): run all N iterations and report how many
      #     failed. This is the only way to MEASURE a rate — accepted guidance is
      #     to repeat a suspect suite and calculate its failure rate rather than
      #     trust anecdote.
      #   stop_early = true: stop the moment one iteration fails. Faster answer
      #     when you only care whether it fails at all.
      #
      # On iteration count: the failure this job was built for showed up about
      # once in 30 runs. A clean run of N iterations gives 1-(1-p)^N confidence
      # it is really fixed — at p=1/30 that is 82% for N=50 but 97% for N=100,
      # and only 57% at N=50 if the true rate is half what we observed. Hence the
      # default of 100. Do not lower it without redoing that arithmetic.
      #
      # -retry-tests-on-failure is deliberately NOT used. It silently re-runs
      # failed tests, which would hide the exact thing this job exists to find,
      # and it is known to report wrong failure counts
      # (XCTestHTMLReport/XCTestHTMLReport#217).
      #
      # CAVEAT: the simulator launch-crash flake that tuist-apps.yml retries
      # ("Early unexpected exit" / "test runner crashed before establishing
      # connection") aborts the whole invocation rather than one iteration.
      # If the hunt ends early, grep the log for that signature before
      # attributing the failure to the code under test.
      - name: Hunt ${{ inputs.app }} (${{ inputs.platform }})
        env:
          SCHEME: ${{ inputs.app }}
          PLATFORM: ${{ inputs.platform }}
          ITERATIONS: ${{ inputs.iterations }}
          STOP_EARLY: ${{ inputs.stop_early }}
        run: |
          RESULTS="${RUNNER_TEMP:-/tmp}/xcresults"
          mkdir -p "$RESULTS"
          # Positional params keep the optional flag quote-safe.
          if [ "$STOP_EARLY" = "true" ]; then set -- -run-tests-until-failure; else set --; fi
          echo "Running $ITERATIONS iterations (stop_early=$STOP_EARLY)"
          xcodebuild test-without-building \
            -skipMacroValidation -skipPackagePluginValidation \
            -scmProvider system -disablePackageRepositoryCache \
            -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -destination "$DESTINATION" -derivedDataPath "$DERIVED_DATA" \
            -test-iterations "$ITERATIONS" "$@" \
            -resultBundlePath "$RESULTS/$SCHEME-$PLATFORM-hunt.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      # always(), not failure(): a clean hunt's bundle carries the per-iteration
      # timings that justify calling a flake fixed.
      - name: Upload hunt results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-hunt-${{ inputs.app }}-${{ inputs.platform }}
          path: ${{ runner.temp }}/xcresults
          retention-days: 14
          if-no-files-found: ignore
