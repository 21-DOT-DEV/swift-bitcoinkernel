name: Docker Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    # ~6x the observed ~7-min build — covers base-image pull variance; a hung
    # RUN had no bound at all under the 360-min default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: default, traits: "" }
          - { name: wallet,  traits: "wallet" }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        run: docker build --build-arg TRAITS=${{ matrix.traits }} .
